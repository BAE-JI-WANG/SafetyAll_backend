name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Docker가 있는 러너에서는 MySQL 8.4 통합 테스트(Testcontainers)도 함께 실행된다
      - name: Build and test
        run: ./gradlew --no-daemon build
