spring:
  application:
    name: safetyall-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/safetyall?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:safetyall}
    # 기본값을 두지 않는다. 설정하지 않으면 시작 시 실패해 실수로 약한 비밀번호로 뜨는 일을 막는다.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

safetyall:
  timezone: ${SAFETYALL_TIMEZONE:Asia/Seoul}
  warning-dedupe-window: ${SAFETYALL_WARNING_DEDUPE_WINDOW:PT10S}
  history-limit: ${SAFETYALL_HISTORY_LIMIT:1000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
